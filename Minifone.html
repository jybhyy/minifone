function pickImg(cb,max,reset){
  const done=(s,id)=>{closeSheet();cb(s,id)};
  sheet(`<button data-p="dev">${t("device")}</button><button data-p="alb">${t("album")}</button><button data-p="url">URL</button><div id="uh"></div>${reset?`<button data-p="rs">${t("reset")}</button>`:""}`,e=>{

\"text-[10px] text-white/60 mt-0.5\">${card.cardType}<\/div>\n<\/div>\n<\/div>\n<span class=\"text-[10px] font-mono-num text-white/50 border border-white/15 px-2 py-0.5 rounded-md\">UnionPay 银联<\/span>\n<\/div>\n<!-- 卡号与后四位 -->\n<div class=\"flex items-baseline justify-between my-3\">\n<div class=\"text-[17px] font-mono-num tracking-[0.18em] text-white/95\">\n•••• •••• •••• ${card.last4}\n<\/div>\n<span class=\"text-[11px] text-white/70 hover:text-white underline\">管理 / 查卡号 ›<\/span>\n<\/div>\n<!-- 限额进度条 -->\n<div class=\"pt-3 border-t border-white/10\">\n<div class=\"flex items-center justify-between text-[10px] text-white/70 mb-1.5\">\n<span>今日快捷支付已用<\/span>\n<span class=\"font-mono-num\">¥${card.dailyUsed.toLocaleString()} / ¥${card.dailyLimit.toLocaleString()}<\/span>\n<\/div>\n<div class=\"w-full h-1.5 rounded-full bg-white/15 overflow-hidden\">\n<div class=\"h-full bg-white rounded-full\" style=\"width: ${ratio}%\"><\/div>\n<\/div>\n<\/div>\n<\/div>\n`;\n} else {\nreturn `\n<div onclick=\"openCardDetailModal('${card.id}')\" class=\"family-card-surface rounded-3xl p-4 text-[#1A1A1A] cursor-pointer active:scale-[0.99] transition\">\n<div class=\"flex items-center justify-between mb-2\">\n<div class=\"flex items-center gap-2.5\">\n<div class=\"w-8 h-8 rounded-xl bg-[#1A1A1A] text-white flex items-center justify-center text-[10px] font-mono-num\">AI<\/div>\n<div>\n<div class=\"text-[13px] font-semibold\">${card.bankName}<\/div>\n<div class=\"text-[10px] text-[#757575]\">${card.cardType}<\/div>\n<\/div>\n<\/div>\n<span class=\"text-xs font-mono-num font-semibold\">•••• ${card.last4}<\/span>\n<\/div>\n<div class=\"flex items-center justify-between text-[11px] text-[#757575] pt-2 border-t border-[#DCDCDC]/70\">\n<span>本月 AI 已消费：<strong class=\"text-[#1A1A1A] font-mono-num\">¥${card.dailyUsed}<\/strong> / 额度 ¥${card.dailyLimit}<\/span>\n<span class=\"text-[#1A1A1A] font-medium\">调整额度 ›<\/span>\n<\/div>\n<\/div>\n`;\n}\n}).join('');\n}\nfunction openCardDetailModal(cardId) {\nconst card = WALLET_STATE.cards.find(c => c.id === cardId);\nif (!card) return;\ndocument.getElementById('detail-card-tag').textContent = card.bankEn;\ndocument.getElementById('detail-card-title').textContent = `${card.bankName} (尾号 ${card.last4})`;\nconst body = document.getElementById('card-detail-body');\nbody.innerHTML = `\n<div class=\"p-4 rounded-2xl bg-[#FAFAFA] border border-[#EAEAEA] space-y-2.5\">\n<div class=\"flex items-center justify-between\">\n<span class=\"text-[#757575]\">完整银行卡号<\/span>\n<div class=\"flex items-center gap-2\">\n<span id=\"masked-card-num\" class=\"font-mono-num font-semibold text-[#1A1A1A]\">•••• •••• •••• ${card.last4}<\/span>\n<button onclick=\"revealFullCardNumber('${card.id}')\" class=\"px-2 py-0.5 rounded-md bg-[#1A1A1A] text-white text-[10px]\">验密查看<\/button>\n<\/div>\n<\/div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-[#757575]\">持卡人 / 绑定角色<\/span>\n<span class=\"font-mono-num text-[#1A1A1A]\">${card.holder}<\/span>\n<\/div>\n<div class=\"flex items-center justify-between\">\n<span class=\"text-[#757575]\">当前状态<\/span>\n<span class=\"font-semibold ${card.frozen ? 'text-red-600' : 'text-[#1A1A1A]'}\">${card.frozen ? '已临时止付冻结' : '正常可用 · 银联快付'}<\/span>\n<\/div>\n<\/div>\n<!-- 调整限额滑块 -->\n<div class=\"p-4 rounded-2xl bg-[#FAFAFA] border border-[#EAEAEA] space-y-2\">\n<div class=\"flex items-center justify-between\">\n<span class=\"font-semibold text-[#1A1A1A]\">${card.id === 'aicard' ? 'AI 亲属卡每月消费限额' : '建行卡单日快捷支付限额'}<\/span>\n<span id=\"limit-val-label\" class=\"font-mono-num font-semibold text-[#1A1A1A]\">¥ ${card.dailyLimit.toLocaleString()}<\/span>\n<\/div>\n<input\ntype=\"range\"\nmin=\"500\"\nmax=\"${card.id === 'aicard' ? '20000' : '100000'}\"\nstep=\"500\"\nvalue=\"${card.dailyLimit}\"\noninput=\"updateCardLimit('${card.id}', this.value)\"\nclass=\"w-full accent-[#1A1A1A]\"\n/>\n<div class=\"text-[10px] text-[#757575]\">拖动滑块可实时修改单日或 AI 伴侣可支配上限<\/div>\n<\/div>\n<div class=\"grid grid-cols-2 gap-2.5 pt-1\">\n<button onclick=\"setAsDefaultCard('${card.id}')\" class=\"py-3 rounded-2xl bg-[#F2F2F2] hover:bg-[#EAEAEA] font-medium text-[#1A1A1A] transition\">\n设为默认支付卡\n<\/button>\n<button onclick=\"toggleFreezeCard('${card.id}')\" class=\"py-3 rounded-2xl ${card.frozen ? 'bg-[#1A1A1A] text-white' : 'bg-red-50 text-red-600'} font-medium transition\">\n${card.frozen ? '解除冻结恢复使用' : '一键临时冻结该卡'}\n<\/button>\n<\/div>\n`;\ndocument.getElementById('card-detail-drawer').classList.add('open');\n}\nfunction closeCardDetailModal() {\ndocument.getElementById('card-detail-drawer').classList.remove('open');\n}\nfunction revealFullCardNumber(cardId) {\nconst card = WALLET_STATE.cards.find(c => c.id === cardId);\nrequestPinVerification({\ndesc: `查看 ${card.bankName} 完整卡号`,\namount: 0,\nmethod: `安全验证 · 尾号 ${card.last4}`,\nonSuccess: () => {\nconst numEl = document.getElementById('masked-card-num');\nif (numEl) numEl.textContent = card.fullNumber;\nshowToast('已通过密码验证并显示完整卡号');\n}\n});\n}\nfunction updateCardLimit(cardId, newLimit) {\nconst card = WALLET_STATE.cards.find(c => c.id === cardId);\nif (!card) return;\ncard.dailyLimit = parseInt(newLimit, 10);\ndocument.getElementById('limit-val-label').textContent = '¥ ' + card.dailyLimit.toLocaleString();\nrenderBankCards();\n}\nfunction setAsDefaultCard(cardId) {\nWALLET_STATE.cards.forEach(c => c.isDefault = (c.id === cardId));\nrenderBankCards();\ncloseCardDetailModal();\nshowToast('已设为默认优先扣款卡');\n}\nfunction toggleFreezeCard(cardId) {\nconst card = WALLET_STATE.cards.find(c => c.id === cardId);\nif (!card) return;\ncard.frozen = !card.frozen;\nrenderBankCards();\nopenCardDetailModal(cardId);\nshowToast(card.frozen ? '该卡片已临时止付冻结' : '已解除冻结');\n}\nfunction openTopUpWithdrawModal(mode) {\nactiveTopUpMode = mode;\nconst isTopUp = mode === 'topup';\ndocument.getElementById('tw-modal-title').textContent = isTopUp ? '建行卡充值至零钱 (Top-up)' : '零钱提现至建行卡 (Withdraw)';\ndocument.getElementById('tw-amount-label').textContent = isTopUp ? '充值金额 ounded-full bg-ink text-white flex items-center justify-center hover:opacity-90 active:scale-95 transition-all\">\n<i data-lucide=\"plus\" class=\"w-3.5 h-3.5\"><\/i>\n<\/button>\n<\/div>\n<\/div>\n<!-- Horizontal Multi-C Switcher (多C角色矩阵) -->\n<div id=\"char-switcher-list\" class=\"flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5\">\n<!-- Dynamically rendered by JS -->\n<\/div>\n<!-- Current Char Context & Token Meter Strip -->\n<div class=\"mt-3 pt-2.5 border-t border-line/70 flex items-center justify-between text-[11px]\">\n<div class=\"flex items-center gap-2 min-w-0\">\n<span id=\"active-char-badge\" class=\"font-medium text-ink truncate\">陆沉舟<\/span>\n<span class=\"text-line\">·<\/span>\n<span id=\"active-char-bond\" class=\"font-mono text-[10px] text-graphite\">羁绊 Lv.8 (92°)<\/span>\n<\/div>\n<div class=\"flex items-center gap-2 shrink-0\">\n<span class=\"font-mono text-[10px] text-graphite\">\n挂载 <strong id=\"active-pin-count\" class=\"text-ink font-medium\">4<\/strong> 条 · <strong id=\"active-token-num\" class=\"text-ink font-medium\">310<\/strong><span id=\"active-token-max\" class=\"text-ash\">/1024 tk<\/span>\n<\/span>\n<div class=\"w-14 h-1.5 rounded-full bg-mist overflow-hidden border border-line/60\">\n<div id=\"active-token-bar\" class=\"h-full bg-ink transition-all duration-300\" style=\"width: 32%\"><\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/section>\n<!-- 3. MAIN SCROLLABLE VIEWPORT -->\n<div id=\"main-viewport\" class=\"flex-1 overflow-y-auto no-scrollbar\" style=\"padding-bottom:calc(6rem + var(--bp,0px))\">\n<!-- ==================== TAB 1: 记忆流 (MEMORIES FEED) ==================== -->\n<section id=\"tab-memories\" class=\"px-5 pt-3.5 space-y-3 animate-fade\">\n<!-- Search & Pin-Only Quick Toggle -->\n<div class=\"flex items-center gap-2\">\n<div class=\"relative flex-1\">\n<i data-lucide=\"search\" class=\"w-3.5 h-3.5 text-ash absolute left-3 top-1/2 -translate-y-1/2\"><\/i>\n<input\nid=\"memory-search-input\"\ntype=\"text\"\noninput=\"handleMemorySearch(this.value)\"\nplaceholder=\"搜索记忆内容、#触发词 或对话轮次...\"\nclass=\"w-full pl-8 pr-7 py-1.5 rounded-lg bg-white border border-line text-xs text-ink placeholder:text-ash focus:outline-none focus:border-ink transition-colors\"\n/>\n<button id=\"clear-search-btn\" onclick=\"clearMemorySearch()\" class=\"hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-ash hover:text-ink\">\n<i data-lucide=\"x\" class=\"w-3 h-3\"><\/i>\n<\/button>\n<\/div>\n<button onclick=\"togglePinnedOnly()\" id=\"btn-pinned-only\" class=\"px-2.5 py-1.5 rounded-lg border border-line bg-white text-[11px] text-graphite hover:text-ink flex items-center gap-1 shrink-0 transition-all\">\n<i data-lucide=\"pin\" class=\"w-3 h-3\"><\/i>\n<span>仅看挂载<\/span>\n<\/button>\n<\/div>\n<!-- Category Sub-Tabs (记忆层级分类) -->\n<div class=\"flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5\" id=\"category-tabs\">\n<button onclick=\"setCategoryFilter('all')\" data-cat=\"all\" class=\"cat-pill px-2.5 py-1 rounded-md text-[11px] font-medium bg-ink text-white transition-all whitespace-nowrap\">\n全部 <span id=\"count-all\" class=\"font-mono text-[10px] opacity-75 ml-0.5\"><\/span>\n<\/button>\n<button onclick=\"setCategoryFilter('core')\" data-cat=\"core\" class=\"cat-pill px-2.5 py-1 rounded-md text-[11px] font-medium bg-white text-graphite border border-line hover:text-ink transition-all whitespace-nowrap\">\n核心烙印 Core\n<\/button>\n<button onclick=\"setCategoryFilter('summary')\" data-cat=\"summary\" class=\"cat-pill px-2.5 py-1 rounded-md text-[11px] font-medium bg-white text-graphite border border-line hover:text-ink transition-all whitespace-nowrap\">\n剧情摘要 Summary\n<\/button>\n<button onclick=\"setCategoryFilter('snippet')\" data-cat=\"snippet\" class=\"cat-pill px-2.5 py-1 rounded-md text-[11px] font-medium bg-white text-graphite border border-line hover:text-ink transition-all whitespace-nowrap\">\n心动切片 Snippet\n<\/button>\n<button onclick=\"setCategoryFilter('secret')\" data-cat=\"secret\" class=\"cat-pill px-2.5 py-1 rounded-md text-[11px] font-medium bg-white text-graphite border border-line hover:text-ink transition-all whitespace-nowrap\">\n暗线秘密 Secret\n<\/button>\n<\/div>\n<!-- Memory Cards List -->\n<div id=\"memories-list\" class=\"space-y-2.5 pt-0.5\">\n<!-- Rendered by JS -->\n<\/div>\n<\/section>\n<!-- ==================== TAB 2: AI 提炼台 (AUTO-EXTRACT FROM CHAT) ==================== -->\n<section id=\"tab-refine\" class=\"hidden px-5 pt-4 space-y-4 animate-fade\">\n<!-- Intro Banner -->\n<div class=\"p-3.5 rounded-xl bg-white border border-line shadow-card flex items-center justify-between\">\n<div>\n<div class=\"flex items-center gap-1.5\">\n<span class=\"font-mono text-[10px] uppercase tracking-wider px-1.5 py-0.5 rounded bg-mist text-charcoal\">AUTO-SUMMARIZE<\/span>\n<span id=\"refine-char-name\" class=\"text-xs font-medium text-ink\">与 陆沉舟 的最近对话<\/span>\n<\/div>\n<p class=\"text-[11px] text-graphite mt-1\">从最新未归档的聊天上下文中提取长期记忆与设定变动<\/p>\n<\/div>\n<button onclick=\"runAiExtraction()\" id=\"btn-run-extract\" class=\"px-3 py-1.5 rounded-lg bg-ink text-white text-xs font-medium flex items-center gap-1.5 hover:opacity-90 active:scale-95 transition-all shrink-0\">\n<i data-lucide=\"sparkles\" class=\"w-3.5 h-3.5\"><\/i>\n<span>一键凝练<\/span>\n<\/button>\n<\/div>\n<!-- Raw Recent Chat Log Preview Box -->\n<div class=\"rounded-xl bg-white border border-line shadow-card overflow-hidden\">\n<div class=\"px-3.5 py-2 bg-mist/60 border-b border-line flex items-center justify-between text-[10px] font-mono text-graphite\">\n<span id=\"raw-chat-header\">RAW CHAT LOG · #Chat 184 - 189<\/span>\n<span>UNARCHIVED (未归档)<\/span>\n<\/div>\n<div id=\"raw-chat-box\" class=\"p-3.5 space-y-2.5 text-xs max-h-48 overflow-y-auto no-scrollbar\">\n<!-- Populated dynamically per Char -->\n<\/div>\n<!-- Scanning Bar (Hidden by default) -->\n<div id=\"scan-progress-wrap\" class=\"hidden h-0.5 w-full bg-mist overflow-hidden\">\n<div class=\"w-1/2 h-full bg-ink scan-line\"><\/div>\n<\/div>\n<\/div>\n<!-- Extracted Candidate Memories -->\n<div class=\"space-y-2.5\">\n<div class=\"flex items-center justify-between px-0.5\">\n<span class=\"text-xs font-medium text-ink\">AI 提炼候选切片<\/span>\n<span id=\"candidate-status-text\" class=\"font-mono text-[10px] text-ash\">READY TO EXTRACT<\/span>\n<\/div>\n<div id=\"candidates-container\" class=\"space-y-2.5\">\n<!-- Rendered by JS -->\n<\/div>\n<\/div>\n<\/section>\n<!-- ==================== TAB 3: 羁绊志 (CHAR DOSSIER & MILESTONES) ==================== -->\n<section id=\"tab-dossier\" class=\"hidden px-5 pt-4 space-y-4 animate-fade\">\n<!-- Char Dossier Profile Card -->\n<div id=\"dossier-profile-card\" class=\"p-4 rounded-xl bg-white border border-line shadow-card\">\n<!-- Dynamically populated -->\n<\/div>\n<!-- Two-Column Preferences & Taboos (记忆偏好与雷区) -->\n<div class=\"grid grid-cols-2 gap-2.5\" id=\"dossier-pref-grid\">\n<!-- Dynamically populated -->\n<\/div>\n<!-- Relationship Milestones Timeline (共同经历里程碑) -->\n<div class=\"p-4 rounded-xl bg-white border border-line shadow-card\">\n<div class=\"flex items-center justify-between mb-3.5\">\n<span class=\"text-xs font-semibold text-ink\">关系演进里程碑<\/span>\n<span class=\"font-mono text-[10px] text-ash\">TIMELINE LOG<\/span>\n<\/div>\n<div id=\"dossier-timeline\" class=\"space-y-3.5 relative before:absolute before:left-[5px] before:top-1.5 before:bottom-1.5 before:w-[1px] before:bg-line\">\n<!-- Dynamically populated -->\n<\/div>\n<\/div>\n<\/section>\n<!-- ==================== TAB 4: 挂载池 (CONTEXT ENGINE & TOKEN BUDGET) ==================== -->\n<section id=\"tab-context\" class=\"hidden px-5 pt-4 space-y-4 animate-fade\">\n<!-- Context Injection Overview -->\n<div class=\"p-4 rounded-xl bg-white border border-line shadow-card space-y-3\">\n<div class=\"flex items-center justify-between\">\n<div>\n<h3 class=\"text-xs font-semibold text-ink\">小手机全局记忆挂载引擎<\/h3>\n<p class=\"text-[11px] text-graphite mt-0.5\">控制多角色对话时注入 Prompt 的记忆权重与 Token 预算<\/p>\n<\/div>\n<span class=\"font-mono text-[10px] px-2 py-0.5 rounded bg-ink text-white\">ACTIVE<\/span>\n<\/div>\n<!-- Token Budget Slider -->\n<div class=\"pt-2 border-t border-line/70 space-y-1.5\">\n<div class=\"flex items-center justify-between text-[11px]\">\n<span class=\"text-charcoal\">单角色最大记忆 Token 预算<\/span>\n<span id=\"budget-slider-val\" class=\"font-mono font-medium text-ink\">1024 tk<\/span>\n<\/div>\n<input\ntype=\"range\"\nmin=\"512\"\nmax=\"4096\"\nstep=\"256\"\nvalue=\"1024\"\nid=\"budget-range\" oninput=\"updateTokenBudget(this.value)\"\nclass=\"w-full\"\n/>\n<div class=\"flex justify-between font-mono text-[9px] text-ash\">\n<span>512 tk (轻量省流)<\/span>\n<span>2048 tk (标准沉浸)<\/span>\n<span>4096 tk (超长深层)<\/span>\n<\/div>\n<\/div>\n<\/div>\n<!-- Multi-Char Token Distribution Breakdown -->\n<div class=\"p-4 rounded-xl bg-white border border-line shadow-card space-y-3\">\n<div class=\"flex items-center justify-between\">\n<span class=\"text-xs font-semibold text-ink\">各角色 (多C) 记忆库挂载占比<\/span>\n<span class=\"font-mono text-[10px] text-ash\">MULTI-C ALLOCATION<\/span>\n<\/div>\n<div id=\"multi-c-allocation-list\" class=\"space-y-2.5\">\n<!-- Rendered by JS -->\n<\/div>\n<\/div>\n<div id=\"rules\" class=\"rounded-xl bg-white border border-line shadow-card divide-y divide-line text-xs\"><\/div>\n<\/section>\n<\/div>\n<!-- 4. CLEAN BOTTOM TAB BAR -->\n<nav style=\"height:calc(4rem + var(--bp,0px));padding-bottom:var(--bp,0px)\" class=\"absolute bottom-0 inset-x-0 bg-white/95 backdrop-blur-md border-t border-line px-6 flex items-center justify-between z-20 select-none\">\n<button onclick=\"switchTab('memories')\" id=\"nav-memories\" class=\"flex flex-col items-center justify-center gap-1 text-ink transition-colors\">\n<i data-lucide=\"layers\" class=\"w-4 h-4 stroke-[2]\"><\/i>\n<span class=\"text-[10px] font-medium\">记忆流<\/span>\n<\/button>\n<button onclick=\"switchTab('refine')\" id=\"nav-refine\" class=\"flex flex-col items-center justify-center gap-1 text-ash hover:text-ink transition-colors\">\n<i data-lucide=\"sparkles\" class=\"w-4 h-4 stroke-[1.8]\"><\/i>\n<span class=\"text-[10px] font-medium\">AI 提炼<\/span>\n<\/button>\n<button onclick=\"switchTab('dossier')\" id=\"nav-dossier\" class=\"flex flex-col items-center justify-center gap-1 text-ash hover:text-ink transition-colors\">\n<i data-lucide=\"book-user\" class=\"w-4 h-4 stroke-[1.8]\"><\/i>\n<span class=\"text-[10px] font-medium\">羁绊志<\/span>\n<\/button>\n<button onclick=\"switchTab('context')\" id=\"nav-context\" class=\"flex flex-col items-center justify-center gap-1 text-ash hover:text-ink transition-colors\">\n<i data-lucide=\"cpu\" class=\"w-4 h-4 stroke-[1.8]\"><\/i>\n<span class=\"text-[10px] font-medium\">挂载池<\/span>\n<\/button>\n<\/nav>\n<!-- ==================== MODAL 1: ADD / EDIT MEMORY SHEET ==================== -->\n<div id=\"memory-modal\" class=\"hidden absolute inset-0 z-40 bg-black/40 backdrop-blur-[2px] flex flex-col justify-end\">\n<div class=\"bg-porcelain rounded-t-3xl border-t border-line p-5 pb-7 shadow-sheet space-y-4 animate-fade max-h-[86%] overflow-y-auto no-scrollbar\">\n<div class=\"flex items-center justify-between\">\n<div>\n<h3 id=\"modal-title\" class=\"text-sm font-semibold text-ink\">写入记忆切片<\/h3>\n<p class=\"text-[11px] text-graphite\">归档后的记忆可直接挂载至小手机对话上下文<\/p>\n<\/div>\n<button onclick=\"closeEditModal()\" class=\"w-7 h-7 rounded-full bg-mist flex items-center justify-center text-graphite hover:text-ink\">\n<i data-lucide=\"x\" class=\"w-3.5 h-3.5\"><\/i>\n<\/button>\n<\/div>\n<input type=\"hidden\" id=\"edit-memory-id\" value=\"\" />\n<!-- Target Char & Category -->\n<div class=\"grid grid-cols-2 gap-2.5\">\n<div>\n<label class=\"block text-[10px] font-mono text-graphite uppercase mb-1\">归属角色 (CHAR)<\/label>\n<select id=\"form-char-id\" class=\"w-full px-3 py-2 rounded-lg bg-white border border-line text-xs text-ink focus:outline-none focus:border-ink\">\n<!-- Populated by JS -->\n<\/select>\n<\/div>\n<div>\n<label class=\"b const tick=()=>{const e=$("#sbt");if(e)e.textContent=clock()};
function applyLang(){if(S.nav==="keys")S.nav="bar";S.pages=normPages(S.pages);S.dock=normDock(S.dock);document.documentElement.lang=lc();applyLook();applyFont();applyFs();$("#ecancel").textContent=t("cancel");$("#edone").textContent=t("done");home();pager.onscroll();sbRender();navRender();fabRender();tick()}
setInterval(tick,30000);applyLang();phLoad().then(()=>{applyLook();home()});

/* ===== music dynamic island ===== */
(()=>{const M=window.__MP,ph=document.getElementById("phone");if(!M||!ph)return;S.mdi=S.mdi||{hide:0,ly:1};let open=0,lastK="";
 const el=document.createElement("div");el.id="mdi";ph.appendChild(el);
 const song=()=>M.cur||(S.mus&&S.mus.on&&AU&&!AU.paused?{id:"mus",title:S.mus.title,artist:S.mus.artist,cov:""}:null);
 const aud=()=>M.cur?M.a:(AU||M.a);
 const playing=()=>!!song()&&(!!M.loading||!aud().paused);
 const tg=()=>!!(S.mus&&S.mus.on&&S.mus.together&&playing());
 const pn=()=>S.contacts.find(c=>c.id===(S.mus&&S.mus.cid));
 const E2=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
 const fm=s=>{s=Math.max(0,s|0);return String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
 const lyNow=(t)=>{if(!t||!t.ly)return"";let s="";t.ly.forEach(l=>{if(l[0]>=0&&aud().currentTime>=l[0])s=l[1]});return s};
 const LYQ={};function getLy(t){if(!t||t.ly||LYQ[t.id]||t.id==="mus")return;LYQ[t.id]=1;fetch("https://lrclib.net/api/search?q="+encodeURIComponent(t.title+" "+t.artist)).then(r=>r.json()).then(j=>{const m=j.find(x=>x.syncedLyrics);if(m){const o=[];m.syncedLyrics.split("\n").forEach(l=>{const x=/\[(\d+):(\d+)/.exec(l),q=l.replace(/\[.*?\]/g,"").trim();if(x&&q)o.push([+x[1]*60+ +x[2],q])});if(o.length)t.ly=o}}).catch(()=>{})}
 const avh=(n,s)=>s?`<img src="${E2(s)}" alt="">`:`<i>${E2((n||"?")[0])}</i>`;
 function mk(){const t=song(),p=pn(),T2=tg(),u=U(),mkk=(S.masks||[]).find(m=>m.id===S.maskCur);
  return {t,p,T2,me:avh(myN(),(mkk&&mkk.av)||u.av),ta:p?avh(dn(p),p.av):""}}
 function draw(){const{t,p,T2,me,ta}=mk(),show=!!t&&playing()&&cur!=="music";
  const ex=open&&show&&!S.mdi.hide;el.className=(show&&!S.mdi.hide?"on ":"")+(show&&S.mdi.hide?"hid ":"")+(ex?"ex ":"")+(T2?"tg":"");
  if(!show){el.innerHTML="";return}
  if(S.mdi.hide){el.innerHTML=`<button class="mdd" data-i="sh">♪</button>`;return}
  const ly=S.mdi.ly?lyNow(t):"",cvs=t.cov?`style="background-image:url('${E2(t.cov)}')"`:"";
  const head=T2?`<span class="mdav">${me}${ta}</span>`:`<span class="mdcv" ${cvs}>${t.cov?"":"♪"}</span>`;
  const ttl=T2?`${E2(S.lang==="en"?"With ":"与 ")}${E2(dn(p))}${E2(S.lang==="en"?" · together":" 一起听")}`:E2(t.title);
  const sub=T2?E2(t.title)+(ly?" · "+E2(ly):""):(M.loading?"正在加载…":ly?E2(ly):E2(t.artist||""));
  if(!ex){el.innerHTML=`<div class="mdc" data-i="ex">${head}<span class="mdt"><b>${ttl}</b><em id="mdl">${sub}</em></span><span class="mdq"><s></s><s></s><s></s></span></div>`;return}
  const a=aud();
  el.innerHTML=`<div class="mdx"><div class="mdh">${head}<span class="mdt"><b>${ttl}</b><em>${T2?E2(t.artist||""):E2(t.artist||"")}</em></span><button data-i="sh" title="隐藏">⌄</button><button data-i="x">✕</button></div>
  ${T2?`<div class="mdhb"><i></i><i></i><i></i><i></i><i></i></div>`:""}
  ${S.mdi.ly?`<div class="mdly" id="mdl">${E2(lyNow(t)||"♪ …")}</div>`:""}
  <div class="mdbar"><i id="mdp" style="width:${a.duration?a.currentTime/a.duration*100:0}%"></i></div><div class="mdtm"><span id="mdt1">${fm(a.currentTime)}</span><span>${fm(a.duration||0)}</span></div>
  <div class="mdb"><button data-i="ly" class="${S.mdi.ly?"on":""}">词</button><button data-i="pv">⏮</button><button data-i="pp" class="mdpp">${a.paused?"▶":"❚❚"}</button><button data-i="nx">⏭</button><button data-i="sh2">—</button></div></div>`}
 el.onclick=e=>{const b=e.target.closest("[data-i]");if(!b)return;e.stopPropagation();const k=b.dataset.i;
  if(k==="ex")open=1;else if(k==="sh"||k==="sh2"){S.mdi.hide=S.mdi.hide?0:1;open=0;save()}else if(k==="ly"){S.mdi.ly=S.mdi.ly?0:1;save()}
  else if(k==="pp"){const a=aud();a.paused?a.play().catch(()=>{}):a.pause()}else if(k==="pv")M.step(-1);else if(k==="nx")M.step(1);
  else if(k==="x"){aud().pause();if(S.mus)S.mus.on=0;open=0;save()}
  lastK="";draw()};
 document.addEventListener("click",e=>{if(open&&!el.contains(e.target)){open=0;lastK="";draw()}},true);
 setInterval(()=>{const t=song();getLy(t);const k=[t&&t.id,playing(),tg(),cur,open,S.mdi.hide,S.mdi.ly,t&&!!t.ly,t&&t.cov].join("|");if(k!==lastK){lastK=k;draw();return}
  const l=document.getElementById("mdl");if(l&&t&&S.mdi.ly){const s=lyNow(t);if(s&&l.textContent!==s&&(open||!tg()))l.textContent=s}
  const a=aud(),pp=document.getElementById("mdp");if(pp&&a.duration){pp.style.width=a.currentTime/a.duration*100+"%";const t1=document.getElementById("mdt1");if(t1)t1.textContent=fm(a.currentTime)}},400);
})();
</script>
</body>
</html>
